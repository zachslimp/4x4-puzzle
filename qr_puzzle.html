<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Puzzle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  h1 {
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: #00ff88;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .subtitle {
    font-size: 0.75rem;
    color: #555;
    letter-spacing: 0.1em;
    margin-bottom: 24px;
  }

  .game-area {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .panel-label {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: #444;
    text-transform: uppercase;
  }

  #puzzle-board {
    position: relative;
    border: 1px solid #222;
    background: #111;
    cursor: default;
    user-select: none;
  }

  .piece {
    position: absolute;
    background-image: var(--bg);
    background-size: var(--bgs);
    background-position: var(--bgp);
    cursor: grab;
    transition: box-shadow 0.1s;
    border: 1px solid rgba(255,255,255,0.04);
  }

  .piece:hover {
    box-shadow: 0 0 0 2px rgba(0,255,136,0.4);
    z-index: 10;
  }

  .piece.dragging {
    cursor: grabbing;
    box-shadow: 0 0 0 2px #00ff88, 0 8px 24px rgba(0,0,0,0.6);
    z-index: 1000;
    opacity: 0.92;
  }

  .piece.correct {
    border-color: rgba(0,255,136,0.15);
  }

  .stats {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    font-size: 0.72rem;
    color: #555;
    letter-spacing: 0.08em;
  }

  .stat-val {
    color: #00ff88;
    font-weight: bold;
  }

  .btn {
    margin-top: 16px;
    background: transparent;
    border: 1px solid #333;
    color: #888;
    padding: 8px 20px;
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .btn:hover {
    border-color: #00ff88;
    color: #00ff88;
  }

  #win-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    gap: 20px;
  }

  #win-overlay.show { display: flex; }

  #win-overlay h2 {
    font-size: 2rem;
    color: #00ff88;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  #win-overlay p {
    color: #888;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }

  #win-qr {
    border: 2px solid #00ff88;
    display: block;
  }

  #win-overlay .btn {
    border-color: #00ff88;
    color: #00ff88;
    font-size: 0.85rem;
    padding: 10px 28px;
  }

  .progress-bar-wrap {
    width: 100%;
    height: 3px;
    background: #1a1a1a;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }

  .progress-bar {
    height: 100%;
    background: #00ff88;
    width: 0%;
    transition: width 0.3s ease;
  }
</style>
</head>
<body>

<h1>QR Puzzle</h1>
<p class="subtitle">Rearrange the pieces to reveal the code</p>

<div class="game-area">
  <div class="panel">
    <div class="panel-label">Puzzle</div>
    <div id="puzzle-board"></div>
    <div class="progress-bar-wrap" style="width:var(--board-size)">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="stats">
      <span>MOVES <span class="stat-val" id="move-count">0</span></span>
      <span>CORRECT <span class="stat-val" id="correct-count">0</span> / 16</span>
    </div>
    <button class="btn" onclick="shuffleBoard()">↺ Shuffle</button>
  </div>


</div>

<div id="win-overlay">
  <h2>✓ Solved!</h2>
  <p>Scan the QR code below</p>
  <img id="win-qr" alt="QR Code">
  <button class="btn" onclick="closeWin()">↺ Play Again</button>
</div>

let pieces = [];
let grid = []; // grid[row][col] = pieceIndex
let dragPiece = null;
let dragStartX, dragStartY, dragOffX, dragOffY;
let moves = 0;

const board = document.getElementById('puzzle-board');
board.style.width = SIZE + 'px';
board.style.height = SIZE + 'px';
board.style.setProperty('--board-size', SIZE + 'px');

document.getElementById('win-qr').src = IMG_SRC;
document.getElementById('win-qr').width = 260;
document.getElementById('win-qr').height = 260;

// Create pieces
function initPieces() {
  board.innerHTML = '';
  pieces = [];
  grid = Array.from({length: GRID}, () => Array(GRID).fill(null));

  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const idx = r * GRID + c;
      const el = document.createElement('div');
      el.className = 'piece';
      el.dataset.idx = idx;
      el.dataset.correctRow = r;
      el.dataset.correctCol = c;
      el.style.width = CELL + 'px';
      el.style.height = CELL + 'px';
      el.style.setProperty('--bg', 'url(' + IMG_SRC + ')');
      el.style.setProperty('--bgs', SIZE + 'px ' + SIZE + 'px');
      el.style.setProperty('--bgp', (-c * CELL) + 'px ' + (-r * CELL) + 'px');

      el.addEventListener('mousedown', startDrag);
      el.addEventListener('touchstart', startDragTouch, {passive: false});

      board.appendChild(el);
      pieces.push({ el, correctRow: r, correctCol: c, row: r, col: c });
    }
  }
  // Fill grid in correct positions
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      grid[r][c] = r * GRID + c;

  renderPositions();
}

function renderPositions() {
  for (let idx = 0; idx < pieces.length; idx++) {
    const p = pieces[idx];
    p.el.style.left = p.col * CELL + 'px';
    p.el.style.top = p.row * CELL + 'px';
    const isCorrect = p.row === p.correctRow && p.col === p.correctCol;
    p.el.classList.toggle('correct', isCorrect);
  }
  updateStats();
}

function shuffleBoard() {
  moves = 0;
  document.getElementById('move-count').textContent = '0';

  // Fisher-Yates shuffle on grid
  let positions = [];
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      positions.push({r, c});

  for (let i = positions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [positions[i], positions[j]] = [positions[j], positions[i]];
  }

  for (let idx = 0; idx < pieces.length; idx++) {
    const {r, c} = positions[idx];
    pieces[idx].row = r;
    pieces[idx].col = c;
    grid[r][c] = idx;
  }
  renderPositions();
}

function updateStats() {
  let correct = 0;
  for (const p of pieces) {
    if (p.row === p.correctRow && p.col === p.correctCol) correct++;
  }
  document.getElementById('correct-count').textContent = correct;
  document.getElementById('progress-bar').style.width = (correct / 16 * 100) + '%';

  if (correct === 16) {
    setTimeout(() => {
      document.getElementById('win-overlay').classList.add('show');
    }, 300);
  }
}

// Drag logic
function startDrag(e) {
  e.preventDefault();
  const el = e.currentTarget;
  const idx = parseInt(el.dataset.idx);
  dragPiece = pieces[idx];
  el.classList.add('dragging');

  const rect = board.getBoundingClientRect();
  dragOffX = e.clientX - rect.left - dragPiece.col * CELL;
  dragOffY = e.clientY - rect.top - dragPiece.row * CELL;

  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}

function startDragTouch(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const el = e.currentTarget;
  const idx = parseInt(el.dataset.idx);
  dragPiece = pieces[idx];
  el.classList.add('dragging');

  const rect = board.getBoundingClientRect();
  dragOffX = touch.clientX - rect.left - dragPiece.col * CELL;
  dragOffY = touch.clientY - rect.top - dragPiece.row * CELL;

  document.addEventListener('touchmove', onDragTouch, {passive: false});
  document.addEventListener('touchend', endDragTouch);
}

function onDrag(e) {
  if (!dragPiece) return;
  const rect = board.getBoundingClientRect();
  let x = e.clientX - rect.left - dragOffX;
  let y = e.clientY - rect.top - dragOffY;
  x = Math.max(0, Math.min(SIZE - CELL, x));
  y = Math.max(0, Math.min(SIZE - CELL, y));
  dragPiece.el.style.left = x + 'px';
  dragPiece.el.style.top = y + 'px';
}

function onDragTouch(e) {
  e.preventDefault();
  if (!dragPiece) return;
  const touch = e.touches[0];
  const rect = board.getBoundingClientRect();
  let x = touch.clientX - rect.left - dragOffX;
  let y = touch.clientY - rect.top - dragOffY;
  x = Math.max(0, Math.min(SIZE - CELL, x));
  y = Math.max(0, Math.min(SIZE - CELL, y));
  dragPiece.el.style.left = x + 'px';
  dragPiece.el.style.top = y + 'px';
}

function endDrag(e) {
  if (!dragPiece) return;
  const rect = board.getBoundingClientRect();
  let x = e.clientX - rect.left - dragOffX + CELL / 2;
  let y = e.clientY - rect.top - dragOffY + CELL / 2;
  snapDrop(x, y);
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
}

function endDragTouch(e) {
  if (!dragPiece) return;
  const touch = e.changedTouches[0];
  const rect = board.getBoundingClientRect();
  let x = touch.clientX - rect.left - dragOffX + CELL / 2;
  let y = touch.clientY - rect.top - dragOffY + CELL / 2;
  snapDrop(x, y);
  document.removeEventListener('touchmove', onDragTouch);
  document.removeEventListener('touchend', endDragTouch);
}

function snapDrop(cx, cy) {
  const targetCol = Math.floor(Math.max(0, Math.min(SIZE - 1, cx)) / CELL);
  const targetRow = Math.floor(Math.max(0, Math.min(SIZE - 1, cy)) / CELL);

  dragPiece.el.classList.remove('dragging');

  // Swap with piece in target cell
  const occupant = grid[targetRow][targetCol];

  // Remove dragPiece from its old cell
  grid[dragPiece.row][dragPiece.col] = null;

  if (occupant !== null && occupant !== parseInt(dragPiece.el.dataset.idx)) {
    // Swap occupant to dragPiece's old spot
    pieces[occupant].row = dragPiece.row;
    pieces[occupant].col = dragPiece.col;
    grid[dragPiece.row][dragPiece.col] = occupant;
  }

  dragPiece.row = targetRow;
  dragPiece.col = targetCol;
  grid[targetRow][targetCol] = parseInt(dragPiece.el.dataset.idx);

  moves++;
  document.getElementById('move-count').textContent = moves;

  dragPiece = null;
  renderPositions();
}

function closeWin() {
  document.getElementById('win-overlay').classList.remove('show');
  shuffleBoard();
}

// Init
initPieces();
shuffleBoard();
